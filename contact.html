<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Juri Albeshri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Juri Albeshri</a>
      <nav aria-label="Main">
        <a href="index.html">About Me</a>
        <a href="projects.html">My Projects</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Contact Me</h1>

    <form id="contact-form" method="get">
      <p>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="reason">Reason for Contacting</label>
        <select id="reason" name="reason">
          <option value="inquiry">Inquiry</option>
          <option value="collaboration">Collaboration</option>
          <option value="feedback">Feedback</option>
        </select>
      </p>
      <p>
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="4" minlength="10"></textarea>
      </p>
      <button type="submit">Send Message</button>
    </form>
    <p id="form-status" class="status" lang="ar" dir="rtl" aria-live="polite"></p>
  </main>

  <footer>
    <p>&copy; 2026 Juri Albeshri</p>
  </footer>
  <script type="module" src="js/contact.js"></script>
</body>
</html>
